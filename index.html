<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeadFlow AI Demo v2</title>
<style>
body{font-family:system-ui;background:#f5f6f8;margin:0;color:#17202a}.wrap{max-width:1000px;margin:30px auto;padding:0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:20px}
.chat{height:430px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto}.msg{max-width:78%;padding:11px 13px;border-radius:14px;margin:8px 0}.ai{background:#eef1f5}.user{background:#17202a;color:white;margin-left:auto}
.controls{display:flex;gap:8px}.controls input{flex:1;padding:12px;border:1px solid #ccc;border-radius:10px}button{padding:11px 14px;border:0;border-radius:10px;background:#17202a;color:white}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee}.status{font-weight:700}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap"><h1>LeadFlow AI <small>Demo v2</small></h1>
<p>Prototype: flexible lead qualification for real-estate inquiries.</p>
<div class="grid">
<section class="card"><h2>AI Lead Conversation</h2><div class="chat"><div id="messages" class="messages"></div>
<div class="controls"><input id="input" placeholder="Type naturally…"><button onclick="send()">Send</button></div></div></section>
<section class="card"><h2>Agent Dashboard</h2>
<div class="row"><span>Lead</span><strong>John Smith</strong></div>
<div class="row"><span>Intent</span><strong id="intent">Not qualified</strong></div>
<div class="row"><span>Timeline</span><strong id="timeline">Unknown</strong></div>
<div class="row"><span>Budget</span><strong id="budget">Unknown</strong></div>
<div class="row"><span>Requirements</span><strong id="details">Unknown</strong></div>
<div class="row"><span>Appointment</span><strong id="appt">Not booked</strong></div>
<div class="row"><span>Status</span><strong class="status" id="status">New lead</strong></div>
</section></div></div>
<script>
const m=document.getElementById('messages'),input=document.getElementById('input');
let lead={},stage='intent';
function add(t,w){let d=document.createElement('div');d.className='msg '+w;d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight}
function bot(t){setTimeout(()=>add(t,'ai'),250)}
function update(){
for(const k of ['intent','timeline','budget','details','appt','status'])
document.getElementById(k).textContent=lead[k]||({'status':'New lead'}[k]||'Unknown');
}
function send(){
let t=input.value.trim();if(!t)return;add(t,'user');input.value='';let x=t.toLowerCase();
if(stage==='intent'){
 if(/buy|purchase|looking|house|home|property/.test(x)){lead.intent='Buyer';lead.status='Qualifying lead';stage='timeline';bot("Great. When are you looking to buy?")}
 else if(/sell|selling/.test(x)){lead.intent='Seller';lead.status='Qualifying lead';stage='timeline';bot("Got it. When are you hoping to sell?")}
 else bot("Are you looking to buy or sell a property?");
}else if(stage==='timeline'){
 if(/soon|asap|[1-3]\s*month|one|two|three|weeks?/.test(x)){lead.timeline='Within 3 months';stage='budget';bot("Thanks. What price range or maximum budget are you considering?")}
 else if(/later|year|6|six|12|twelve/.test(x)){lead.timeline='3–12+ months';stage='budget';bot("Thanks. What price range or maximum budget are you considering?")}
 else bot("Roughly when do you expect to move forward?");
}else if(stage==='budget'){
 let n=x.match(/[\d,.]+\s*(k|m|million)?/);if(n){lead.budget=n[0];stage='details';bot("Got it. What are your main requirements, such as bedrooms, location, or property type?")}else bot("A rough budget is perfect, for example $750k or under $900,000.");
}else if(stage==='details'){
 lead.details=t;lead.status='Qualified lead';stage='appointment';bot("Thanks. Would Tuesday at 4 PM or Wednesday at 11 AM work better?");
}else{
 if(/tuesday|4\s*pm|4pm/.test(x)){lead.appt='Tuesday, 4:00 PM';lead.status='Qualified • Appointment booked';bot("Perfect — Tuesday at 4 PM is booked. The agent has been notified.")}
 else if(/wednesday|11/.test(x)){lead.appt='Wednesday, 11:00 AM';lead.status='Qualified • Appointment booked';bot("Perfect — Wednesday at 11 AM is booked. The agent has been notified.")}
 else bot("Please choose Tuesday at 4 PM or Wednesday at 11 AM.");
} update();}
add("Hi John! Thanks for your interest in the property. Are you looking to buy or sell?","ai");
</script></body></html>
